name: Build
on: [push, pull_request]
env:
  buildDir: ${{ github.workspace }}/build/

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Prepare FMDB
        run: bash Scripts/prepare-fmdb.sh
      - name: Build
        run: |
          gem install --verbose xcpretty
          set -o pipefail && xcodebuild -configuration Release -target "Mumble" CONFIGURATION_BUILD_DIR="${PWD}/__build__" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -sdk iphoneos | xcpretty

  backend:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify Apple Silicon and Xcode
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
      - name: Install build tools
        run: brew install cmake ninja pkgconf
      - name: Bootstrap pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout e456309491fd875487bf02b8a0dca76c1b1b00cc
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: ~/.cache/vcpkg/archives
          key: libmumble-vcpkg-${{ runner.os }}-${{ hashFiles('Dependencies/libmumble/vcpkg.json', 'Scripts/vcpkg-triplets/*') }}
      - name: Test backend
        run: bash Scripts/test-libmumble.sh
      - name: Build libmumble XCFramework
        run: bash Scripts/build-libmumble.sh
      - name: Save dependency cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
