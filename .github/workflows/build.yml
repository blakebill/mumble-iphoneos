name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify Apple Silicon and Xcode
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
      - name: Check translations
        run: python3 Scripts/check-localizations.py
      - name: Install build tools
        run: brew install cmake ninja pkgconf
      - name: Bootstrap pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout e456309491fd875487bf02b8a0dca76c1b1b00cc
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: libmumble-vcpkg-${{ runner.os }}-${{ hashFiles('Dependencies/libmumble/vcpkg.json', 'Scripts/vcpkg-triplets/*') }}
      - name: Test backend
        run: bash Scripts/test-libmumble.sh
      - name: Build libmumble XCFramework
        run: bash Scripts/build-libmumble.sh
      - name: Build iPhone application
        run: xcodebuild -project Mumble.xcodeproj -scheme Mumble -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
      - name: Build Simulator application
        run: xcodebuild -project Mumble.xcodeproj -scheme Mumble -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
